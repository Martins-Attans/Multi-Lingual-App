  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Multi-Lingual Website</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>

</head>
<body>
 
  <div class="container">
    <h1>Multi-Lingual Website</h1>
    <p class="desc">Click a button below to change the language.</p>
 
    <div class="btn-group">
      <button class="active" id="btn-eng" onclick="changeLanguage('eng')">English</button>
      <button id="btn-es" onclick="changeLanguage('es')">Spanish</button>
      <button id="btn-hin" onclick="changeLanguage('hin')">Hindi</button>
      <button id="btn-fr" onclick="changeLanguage('fr')">French</button>
      <button id="btn-de" onclick="changeLanguage('de')">German</button>
      <button id="btn-zh" onclick="changeLanguage('zh')">Hausa</button>
    </div>
 
    <div class="content">
      <p id="siteContent">
        Welcome to the Multi-Lingual Website! You can choose any language using the buttons above!
      </p>
      <p class="lang-label" id="langLabel">English</p>
    </div>
  </div>
 
</body>
</html>
